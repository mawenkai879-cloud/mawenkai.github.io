h2><p id="contactText"></p></section></article></main><footer><span id="copyright"></span></footer><script>
const papers=[{"slug":"gjpest4cmr","title":"GjPest4CMR: LLMs-Assisted Morphology-Aware Fine-grained Goji Pest Image-Text Retrieval","authors":"W. Ma et al. · First author","venue":"ICMR 2026 · Published · pp. 138–146","summary":"Introduces an expert-verified, LLM-assisted goji pest image–text dataset and StruMorAlign, combining structured semantic deconfounding and gated adaptive alignment for fine-grained morphology learning.","doi":"https://doi.org/10.1145/3805622.3810821","paragraphs":["Fine-grained goji pest retrieval requires descriptions that distinguish visually similar species using small morphological cues, rather than category labels alone. Existing goji pest corpora such as WPIT9K provide Chinese annotations as single paragraphs. These descriptions can mix generic symptoms with visual details while overlooking body structures, life-stage appearance, and environmental context. Shared phrases can make different pest species appear semantically similar. GjPest4CMR was developed to provide structured English supervision for matching detailed pest descriptions with visual evidence and to support bidirectional image-text retrieval.","GjPest4CMR builds on the images and Chinese annotations of WPIT9K, covering 9,496 images of 17 common goji pest species from Ningxia, China. GPT-4 assists in rewriting the original annotations using a three-sentence template. The first sentence describes basic attributes, including category, color, approximate size, and overall shape. The second records finer structures and posture, such as body segmentation, wing venation, antenna shape, and leg arrangement. The third covers host-plant and background context, including leaf condition, color contrast, and life-stage appearance. This progression connects broad identifying information with the local evidence needed to distinguish similar pests.","Generated descriptions undergo two rounds of expert verification against the corresponding images. Agricultural entomology experts first correct factual mistakes and remove details unsupported by visible evidence. A different expert then cross-checks the revised descriptions to resolve ambiguity and improve annotation consistency. The resulting image-text pairs are organized into training, validation, and test sets with an 80/10/10 split. Alongside this benchmark, StruMorAlign studies how structured descriptions can be matched to local pest morphology for language-driven agricultural search."]},{"slug":"same-align","title":"SaME-Align: Saliency-aware Morphological Semantic Alignment for Fine-grained Goji Pest Image-Text Retrieval","authors":"W. Ma et al. · Submitted manuscript","venue":"Submitted","summary":"Discovers pest-salient visual evidence and selectively matches textual attributes through saliency-aware token selection, asymmetric attribute alignment, and teacher–student supervision.","paragraphs":["Agricultural image–text retrieval depends on local biological evidence such as insect body structures, wing patterns, and color markings. These cues are often small and can be overwhelmed by vegetation, illumination changes, or clutter. Text descriptions also cover only a sparse subset of observable attributes. Consequently, uniformly aligning an entire image with an entire description can miss the evidence that actually distinguishes similar pest categories.","SaME-Align treats fine-grained retrieval as an evidence-grounding problem. Its Saliency-aware Morphological Semantic module (SMorS) selects pest-critical visual tokens while suppressing background-dominated or text-irrelevant regions. Asymmetric Attribute Alignment decomposes descriptions into attribute-level units and selectively matches them to supporting visual evidence, rather than forcing every part of the image and text to contribute equally. Teacher–student soft-label supervision further preserves useful similarity relations among near-neighbor categories.","Experiments investigate bidirectional retrieval on GjPest4CMR, agricultural-domain transfer to CCPRD, and generalization to Flickr30K. Ablations and qualitative visualizations examine the contribution of evidence selection, attribute alignment, and distillation. The results show more focused localization of morphology-critical regions and reduced background distraction, supporting selective alignment when image and text contain different amounts of information."],"hidePdf":true},{"slug":"came-align","title":"FAME-Align: Foreground-aware Morphological Evidence Alignment for Fine-grained Goji Pest Image-Text Retrieval","authors":"Wenkai Ma, Wentao Ma*, Tan Wang*, Tianhao Yang, Yuwei Wang, Lu Liu, Junfei Yang, Meng Cui, Xianbao Xu","venue":"Submitted","summary":"Grounds retrieval in pest morphology using foreground-preserving training views, filtered textual semantics, and foreground-centric alignment. Inference retains the standard RGB–text pipeline.","paragraphs":["Many agricultural pests resemble surrounding leaves and branches in color, texture, and contour. This camouflage-like appearance makes foreground evidence difficult to separate from vegetation. Vision–language models may therefore learn background correlations, while descriptions containing host-plant or scene information can reinforce incorrect matches. Improving region–word alignment alone does not establish whether a correspondence is grounded in the target pest.","The supplied manuscript proposes CAME-Align, a camouflage-aware morphological evidence alignment framework. During training, FastSAM-guided foreground-preserving RGB views expose pest-specific evidence, and caption filtering retains visually grounded semantics. Mask-Privileged Morphology Grounding aligns foreground representations with morphology-bearing text; Evidence-Centric Phrase–Region Alignment matches local regions to textual chunks; and Foreground-to-RGB Consistency Transfer passes foreground-aware knowledge to the original RGB branch while limiting representation drift.","Foreground masks and the auxiliary masked branch are used only during training. Inference retains the standard RGB–text retrieval pipeline, avoiding an additional segmentation dependency. Experiments on GjPest4CMR and CCPRD assess bidirectional retrieval, component contributions, retrieval examples, and attention to camouflaged pests. The central objective is to ground matching in pest morphology rather than incidental environmental context."],"hidePdf":true},{"slug":"mirage","title":"MIRAGE: Modality-Aware Identity-Preserving Relation Alignment with Graded Evidence for Text-to-Image Person Re-Identification","authors":"W. Ma et al. · Submitted manuscript","venue":"Submitted","summary":"Models cross-identity semantic compatibility through graded global–local evidence, while preserving identity discrimination and calibrating image and text embedding distributions.","paragraphs":["Text-to-image person re-identification retrieves a target pedestrian from a gallery using a natural-language description. Descriptions are partial and non-unique: the same caption may fit several people, although only one shares the annotated identity. Standard binary supervision treats every cross-identity pair as negative. This can repel semantically plausible matches, while relabeling them as positive would weaken identity discrimination.","MIRAGE studies Cross-Identity Compatible Pairs (CICPs): correctly labeled, different-identity pairs that remain semantically compatible. Global–Local Inference with Noise Awareness (GLIN) mines candidate pairs, checks them using uncertainty-aware global and local evidence, and estimates graded relation weights. These weights relax compatibility-related penalties without changing identity labels. Distributional Calibration via Cauchy–Schwarz divergence (DC²S) aligns image and text embedding distributions to reduce the modality gap.","The framework is evaluated on CUHK-PEDES, ICFG-PEDES, and RSTPReid through retrieval comparisons, ablations, human compatibility validation, and embedding and attention visualizations. The work separates caption-level compatibility from identity-level equivalence, aiming to preserve meaningful semantic relations while maintaining accurate identity retrieval. This is especially relevant when a query mentions only common clothing or accessories rather than a unique identifying attribute."],"hidePdf":true},{"slug":"manta","title":"Beyond Full Visibility: Learning Occlusion-Robust Text–Image Person Retrieval from Incomplete Evidence","authors":"W. Ma et al. · Submitted","venue":"Submitted","summary":"Combines identity-preserving diffusion occlusion benchmarks with masked cross-modal alignment and neighborhood consistency matching for retrieval under incomplete visual evidence.","paragraphs":["Foreground occlusion can hide the visual attributes described by a text query and make different pedestrians look similar. Such missing evidence disrupts cross-modal alignment. Conventional copy-paste occlusion augmentation can also introduce sharp boundaries and unnatural appearance changes, creating a gap between synthetic training examples and realistic foreground occlusion.","This work introduces MANTA-Occ, diffusion-based occlusion benchmarks derived from CUHK-PEDES, ICFG-PEDES, and RSTPReid. Instruction-guided editing creates realistic foreground occluders, while verification checks identity preservation, clothing consistency, depth ordering, and image quality. The benchmarks retain pedestrian labels, original descriptions, and evaluation splits. MANTA combines global and selected-token representations through an Identity-Relation Backbone. Masked Cross-modal Alignment encourages consistent matching under partial evidence, and Neighborhood Consistency Matching strengthens identity associations across complementary views.","Evaluation covers conventional benchmarks, diffusion-occluded benchmarks, and a naturally occluded test set. Component ablations, ranked retrieval examples, and attention visualizations examine both robustness and discrimination. The research asks how realistic occlusion data and consistent cross-modal identity relationships can improve retrieval when a decisive visual clue is unavailable, rather than assuming complete visibility at test time."],"hidePdf":true}];const $=s=>document.querySelector(s),KEY='academic-home-english-v1';const defs=[['education','📖 Education','时间 · 学位 · 学校 · 专业'],['news','🎉 News','日期 · 论文录用、项目进展或学术活动'],['publications','📝 Selected Publications / 代表论文','论文标题\n作者列表\n期刊 / 会议 · 年份\n论文链接（可选）'],['experience','🔬 Research Experience','时间 · 机构 · 研究工作'],['skills','💻 Skills & Languages','工具 · 研究技能 · 语言'],['projects','🗂 Funded Projects','项目名称 · 时间 · 你的职责\n研究目标与Completed的成果'],['patents','📑 Patents','Patent title · Inventors · Number · Status'],['honors','🏅 Honors & Awards','时间 · 奖项名称 · 授予机构'],];let data={"profile":{"name":"Wenkai Ma","role":"M.Eng. Student in Electronic Information\nAnhui Agricultural University","location":"Hefei, China","email":"mawenkai879@gmail.com","scholar":"","github":"","researchgate":"","avatar":"","bio":"I am a master’s student in Electronic Information at Anhui Agricultural University, advised by Prof. Wentao Ma and Lecturer Tan Wang. I conduct research at the Key Laboratory of Agricultural Sensors, Ministry of Agriculture and Rural Affairs.\nMy research focuses on robust multimodal representation learning and cross-modal alignment for fine-grained retrieval, particularly under semantic ambiguity, visual similarity, and occlusion. I work on image–text retrieval for agricultural pests and text-to-image person re-identification, from problem formulation and model development to experimental validation and manuscript preparation.\nI am strongly motivated by academic research and bring persistence and sustained commitment to long-term research goals.","interests":"Cross-Modal and Image–Text Retrieval · Multimodal Learning and Vision–Language Models · Fine-Grained Visual Recognition · Text-to-Image Person Re-Identification","motto":"Robust multimodal representation learning and cross-modal alignment under semantic ambiguity, visual similarity, and occlusion.","phone":"+86 136 2558 7216"},"sections":{"education":["Sept. 2025 – June 2027 (Expected) · M.Eng. in Electronic Information\nAnhui Agricultural University, Hefei, China\nGPA: 4.40/5.00 · Cohort Rank: 1/80 · Advisors: Prof. Wentao Ma and Lecturer Tan Wang\nThesis: Image-Text Cross-Modal Retrieval Models for Goji Pest Recognition","Sept. 2021 – June 2025 · B.Eng. in Internet of Things Engineering\nCity University of Hefei, Hefei, China\nGPA: 3.91/5.00\nThesis: Design and Development of a Talent Cultivation Platform for Innovation and Entrepreneurship Research"],"news":["Oct. 2026: Submitted research manuscripts to CVPR and WWW.","Oct. 2026: Awarded the National Scholarship for Graduate Students at Anhui Agricultural University (ranked 1/80).","2026: Our GjPest4CMR paper was published at ICMR 2026, pp. 138–146. I presented the work at the conference.","Oct. 2025: Awarded the Third-Class Academic Scholarship for Graduate Students at Anhui Agricultural University."],"publications":["GjPest4CMR\nWenkai Ma（第一作者）及合作者\nACM International Conference on Multimedia Retrieval (ICMR), 2026 · 已录用 / Accepted\n枸杞害虫细粒度图像—文本跨模态检索。"],"projects":["May 2026 – Present · Continual Fine-Tuning of Farmland Remote Sensing Large Models under Phenological Prior Constraints\nNational Natural Science Foundation of China, Young Scientists Fund (Category C)\nCore team member; responsible for figure preparation and core code design. Integrate phenological priors to address distribution shifts across crop growth stages, regions, and time periods while mitigating catastrophic forgetting.","June 2025 – Present · Image-Text Cross-Modal Person Re-Identification in Open Scenarios\nAnhui Provincial Natural Science Foundation, Youth Project (C)\nCore team member; responsible for figure preparation and core code design. Develop fine-grained visual–textual representations and semantic alignment under identity changes, background interference, occlusion, and modality gaps."],"patents":[],"honors":["Oct. 2026 · National Scholarship for Graduate Students\nAnhui Agricultural University · Ranked 1/80","Oct. 2025 · Third-Class Academic Scholarship for Graduate Students\nAnhui Agricultural University","Nov. 2024 · Excellent Volunteer · Ranked 1/63\nMorita Therapy Academic Conference, Chinese Association for Mental Health"],"experience":["June 2025 – Present · Graduate Researcher\nKey Laboratory of Agricultural Sensors, Ministry of Agriculture and Rural Affairs, Anhui Agricultural University\nSupervisors: Prof. Wentao Ma and Lecturer Tan Wang\nIndependently conduct the full research cycle and supervise undergraduates through literature review, experimental design, implementation, and manuscript writing.","Fine-Grained Image–Text Retrieval for Goji Pest Recognition\nConstructed GjPest4CMR with 9,496 images across 17 categories, LLM-assisted structured descriptions, and expert verification. Developed StruPD and GateA² within StruMorAlign, achieving 78.72% mean recall, 9.72 percentage points above a strong baseline. Further developed saliency-aware and foreground-aware alignment methods.","Identity-Preserving Relation Alignment for Text-to-Image Person Re-Identification\nDevelop MIRAGE to improve pedestrian retrieval when a text description fits multiple people with different identities. Study Cross-Identity Compatible Pairs (CICPs), text-image pairs involving different pedestrian identities whose visible attributes still match the same description. Account for this semantic ambiguity while preserving accurate identity matching.","Occlusion-Robust Text-Image Person Retrieval\nConstruct MANTA-Occ, a foreground-occlusion benchmark derived from CUHK-PEDES, ICFG-PEDES, and RSTPReid. Sample source images at the identity level within the official dataset splits, then use diffusion inpainting with varied prompts to introduce occluders such as pedestrians, bicycles, poles, and roadside objects. Screen candidate edits for pedestrian identity, clothing, caption-relevant attributes, and plausible scene depth, removing inconsistent or unnatural edits. Retain the original identity labels, text descriptions, and dataset splits to support text-based pedestrian retrieval under occlusion."],"skills":["Programming & Tools · Python, PyTorch, C/C++, MATLAB, Git, LaTeX, Linux, Photoshop","Deep Learning · CLIP, Vision Transformers, Contrastive Learning, Fine-Tuning","Computing · CUDA, GPU-Accelerated Training, Multi-GPU Experiment Management"]},"tasks":[{"title":"SaME-Align","description":"Saliency-aware morphological semantic alignment for fine-grained goji pest image–text retrieval. Submitted.","status":"active"},{"title":"MIRAGE","description":"Graded compatibility learning and modality calibration for text-to-image person re-identification. Submitted.","status":"active"},{"title":"FAME-Align / CAME-Align","description":"Foreground-aware evidence grounding for fine-grained pest retrieval. Submitted.","status":"active"},{"title":"Beyond Full Visibility / MANTA","description":"Occlusion-robust text–image person retrieval from incomplete evidence. Submitted.","status":"active"}]};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};function render(){data.sections.skills=data.sections.skills.filter(t=>!/^Languages\s*[·:]/.test(t)&&!/^语言[：:]/.test(t));data.tasks=data.tasks.map(t=>({...t,description:t.description.replace(/(Submitted to|In preparation for) (WSDM|WWW|ICASSP|CVPR) 2027\./g,"Submitted.")}));data.sections.education=data.sections.education.map(t=>t.split("\n核心课程：电子通信")[0]);if(!data.sections.honors?.length)data.sections.honors=['国家奖学金','三等奖学金'];const p=data.profile;$('#name').textContent=p.name;$('#role').textContent=p.role;$('#role').style.whiteSpace='pre-line';$('#bio').textContent=p.bio;$('#interests').textContent=p.interests;$('#motto').textContent=p.motto;$('#avatar').innerHTML=/^data:image\/(png|jpeg|webp);base64,/.test(p.avatar||'')?`<img src="${p.avatar}" alt="${esc(p.name)} portrait">`:'<img src="profile.jpg" alt="Portrait of Wenkai Ma">';$('#links').innerHTML=`<span>⌖ ${esc(p.location||'城市，国家')}</span>`+(p.email?`<a href="mailto:${encodeURIComponent(p.email)}">✉ Email</a>`:'')+[['researchgate','ResearchGate'],['github','Github'],['scholar','Google Scholar']].filter(([k])=>url(p[k])).map(([k,n])=>`<a href="${esc(url(p[k]))}" target="_blank" rel="noopener">↗ ${n}</a>`).join('')+'<a href="wenkai-ma-cv.pdf" target="_blank" rel="noopener">↗ Curriculum Vitae [PDF]</a>';$('#sections').innerHTML=defs.map(([id,title,hint])=>id==='publications'?`<section id="publications"><h2>📝 Selected Publications &amp; Manuscripts</h2><p class="publication-note">* Corresponding author · Accepted / Submitted / Manuscript indicate the status of each work.</p>${papers.map(p=>`<div class="publication"><div class="paper-preview"><span>${esc(p.venue)}</span>${p.noPdf?`<div class="paper-unavailable">Research Manuscript<br>Point Cloud / Image–Text Retrieval</div>`:`<a href="papers/${p.slug}-poster-v2.png" target="_blank" rel="noopener"><img src="papers/${p.slug}-poster-v2.png" alt="${esc(p.title)}visual research poster" loading="lazy"></a>`}</div><div><h3>${esc(p.title)}</h3><p class="authors">${esc(p.authors)}</p><p class="venue">${esc(p.venue)}</p>${p.doi?`<a class="paper-link" href="${esc(p.doi)}" target="_blank" rel="noopener">[DOI]</a>`:``}${p.noPdf||p.hidePdf?``:`<a class="paper-link" href="papers/${p.slug}.pdf" target="_blank" rel="noopener">[PDF]</a><a class="paper-link" href="papers/${p.slug}.pdf" download>[Download]</a>`}${p.note?`<p class="publication-note">${esc(p.note)}</p>`:``}<div class="paper-description">${(p.paragraphs||[p.summary]).map(t=>`<p>${esc(t)}</p>`).join('')}</div></div></div>`).join('')}</section>`:`<section id="${id}"> function balancePublications(){
 if(window.innerWidth<=850)return;
 document.querySelectorAll('.publication').forEach(row=>{
  const img=row.querySelector('img'),right=row.children[1],desc=right.querySelector('.paper-description');
  if(!img||!desc||!img.complete||!img.naturalWidth)return;
  const target=img.getBoundingClientRect().height;
  let low=11.5,high=15;
  for(let i=0;i<12;i++){const mid=(low+high)/2;desc.querySelectorAll('p').forEach(p=>p.style.fontSize=mid+'px');if(right.getBoundingClientRect().height>target)high=mid;else low=mid;}
  desc.querySelectorAll('p').forEach(p=>p.style.fontSize=low+'px');
 });
}
document.querySelectorAll('.publication img').forEach(img=>img.addEventListener('load',balancePublications));
window.addEventListener('resize',balancePublications);requestAnimationFrame(balancePublications);
</script></body></html>
